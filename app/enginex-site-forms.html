<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGINEX Site Forms &amp; Document Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101E2B;
  --ink-soft:#3B4C5C;
  --steel:#2E5266;
  --steel-light:#5A7A8C;
  --paper:#F6F5F1;
  --sheet:#FFFFFF;
  --line:#D6D9D6;
  --line-soft:#E7E9E5;
  --accent:#B9862F;
  --accent-ink:#7A5416;
  --accent-soft:#F1E4C9;
  --danger:#A6432B;
  --ok:#3C6E52;
  --sans: 'IBM Plex Sans', -apple-system, Segoe UI, Arial, sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
  --serif: 'IBM Plex Serif', Georgia, serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  font-size:14px;
  line-height:1.5;
}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:13px;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:290px;flex:0 0 290px;
  background:var(--ink);
  color:#DCE3E8;
  display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0;
}
.brand{
  padding:20px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.brand .mark{
  font-family:var(--serif);
  font-size:20px;letter-spacing:.02em;color:#fff;font-weight:600;
}
.brand .sub{
  font-family:var(--mono);
  font-size:10.5px;color:var(--accent);letter-spacing:.08em;margin-top:3px;text-transform:uppercase;
}
.search-wrap{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.search-wrap input{
  width:100%;padding:8px 10px;border-radius:2px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);color:#fff;
}
.search-wrap input::placeholder{color:#8FA0AC;}
.nav{flex:1;overflow-y:auto;padding:8px 0 16px;}
.nav-cat{
  padding:12px 18px 6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  color:#7E93A1;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:baseline;gap:8px;
  padding:7px 18px;cursor:pointer;
  border-left:2px solid transparent;
  color:#C7D2D9;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{
  background:rgba(185,134,47,.14);
  border-left-color:var(--accent);
  color:#fff;
}
.nav-item .code{font-family:var(--mono);font-size:11px;color:var(--steel-light);flex:0 0 auto;}
.nav-item.active .code{color:var(--accent);}
.nav-item .nm{font-size:12.5px;flex:1;}
.sidebar-foot{
  padding:12px 18px;border-top:1px solid rgba(255,255,255,.1);
  font-size:11px;color:#7E93A1;
}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:12px 28px;background:var(--sheet);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;
}
.topbar .company-chip{
  display:flex;align-items:center;gap:10px;flex:1;min-width:0;
}
.company-chip img{height:34px;width:auto;max-width:120px;object-fit:contain;}
.company-chip .logo-ph{
  height:34px;width:34px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--ink-soft);flex:0 0 auto;
}
.company-chip .cname{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.company-chip .cproj{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.btn{
  padding:8px 14px;border-radius:2px;border:1px solid var(--line);
  background:var(--sheet);color:var(--ink);font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--steel);}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn.primary:hover{background:var(--steel);border-color:var(--steel);}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.small{padding:5px 9px;font-size:11.5px;}
.btn.danger{color:var(--danger);}

.workspace{flex:1;padding:34px 28px 80px;display:flex;justify-content:center;}
.empty-state{
  max-width:520px;margin-top:80px;text-align:center;color:var(--ink-soft);
}
.empty-state h2{font-family:var(--serif);color:var(--ink);font-weight:600;}

/* ---------- The Sheet (form) ---------- */
.sheet{
  width:100%;max-width:900px;background:var(--sheet);
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,30,43,.04), 0 10px 30px -18px rgba(16,30,43,.25);
}
.sheet-actions{
  display:flex;gap:8px;align-items:center;justify-content:flex-end;
  max-width:900px;width:100%;margin-bottom:10px;
}
.sheet-actions .spacer{flex:1;}

.letterhead{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:22px 30px 14px;border-bottom:2px solid var(--ink);
  gap:16px;
}
.letterhead .lh-left{display:flex;align-items:center;gap:12px;min-width:0;}
.letterhead .lh-left img{max-height:52px;max-width:170px;object-fit:contain;}
.letterhead .lh-co{font-weight:600;font-size:15px;color:var(--ink);}
.letterhead .lh-co-addr{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.letterhead .lh-right{text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
.letterhead .lh-code{color:var(--ink);font-weight:600;font-size:12.5px;}

.form-title-bar{
  padding:16px 30px 4px;text-align:center;
}
.form-title-bar h1{
  font-family:var(--serif);font-size:20px;font-weight:600;margin:0;letter-spacing:.01em;color:var(--ink);
}
.form-title-bar .form-sub{font-family:var(--mono);font-size:11px;color:var(--steel);margin-top:4px;letter-spacing:.04em;}

.sheet-body{padding:10px 30px 34px;}

.block{margin-top:20px;}
.block:first-child{margin-top:16px;}
.block-title{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--steel);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--line-soft);
}

.fgrid{display:grid;gap:12px 18px;}
.fgrid.c1{grid-template-columns:1fr;}
.fgrid.c2{grid-template-columns:1fr 1fr;}
.fgrid.c3{grid-template-columns:1fr 1fr 1fr;}
.fgrid.c4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media (max-width: 720px){.fgrid.c2,.fgrid.c3,.fgrid.c4{grid-template-columns:1fr;}}

.field{display:flex;flex-direction:column;gap:4px;}
.field.span2{grid-column:span 2;}
.field label{font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em;}
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
  border:none;border-bottom:1px solid var(--line);background:transparent;
  padding:5px 2px;color:var(--ink);width:100%;
}
.field textarea{resize:vertical;min-height:52px;font-family:var(--sans);border:1px solid var(--line);border-radius:2px;padding:7px 8px;}
.field input:focus, .field textarea:focus, .field select:focus{
  outline:none;border-color:var(--steel);
}
.field.mono input{font-family:var(--mono);}

.row-flex{display:flex;gap:22px;flex-wrap:wrap;}
.row-flex > div{flex:1;min-width:180px;}

.check-group{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:2px;}
.check-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);}
.check-item input{accent-color:var(--steel);}

.note-block{
  background:var(--paper);border-left:3px solid var(--steel);
  padding:10px 14px;font-size:12px;color:var(--ink-soft);line-height:1.55;
}

.legend-block .legend-title{font-weight:600;font-size:12px;margin-bottom:6px;}
.legend-list{display:flex;flex-direction:column;gap:4px;}
.legend-row{display:flex;gap:10px;font-size:12px;align-items:baseline;}
.legend-row .lc{
  font-family:var(--mono);font-weight:700;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:2px;padding:0 6px;flex:0 0 auto;
}

table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{
  background:var(--paper);color:var(--ink-soft);font-weight:600;text-align:left;
  padding:6px 7px;border:1px solid var(--line);font-size:10.5px;letter-spacing:.02em;text-transform:uppercase;
}
table.tbl td{border:1px solid var(--line);padding:2px;vertical-align:top;}
table.tbl td input, table.tbl td textarea{
  width:100%;border:none;background:transparent;padding:5px 6px;font-size:12px;color:var(--ink);
}
table.tbl td input:focus, table.tbl td textarea:focus{outline:1px solid var(--steel);outline-offset:-1px;}
table.tbl tr.total-row td{background:var(--paper);font-weight:600;}
table.tbl .rowdel{
  border:none;background:transparent;color:var(--ink-soft);width:22px;text-align:center;
}
table.tbl .rowdel:hover{color:var(--danger);}
.table-wrap{overflow-x:auto;}
.add-row-btn{
  margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--steel);
  background:none;border:1px dashed var(--line);padding:5px 10px;border-radius:2px;
}
.add-row-btn:hover{border-color:var(--steel);}

.sign-grid{display:grid;gap:0 18px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.sign-party{border-top:1px solid var(--ink);padding-top:8px;}
.sign-party .party-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin-bottom:8px;}
.sign-party .sfield{margin-bottom:9px;}
.sign-party .sfield label{font-size:10px;color:var(--ink-soft);display:block;margin-bottom:2px;}
.sign-party .sfield input{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;padding:3px 1px;font-size:12.5px;}

.finance-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.finance-tbl td{padding:6px 4px;border-bottom:1px solid var(--line-soft);}
.finance-tbl td.flabel{color:var(--ink);}
.finance-tbl td.fval{text-align:right;width:190px;}
.finance-tbl td.fval input{width:140px;text-align:right;border:none;border-bottom:1px solid var(--line);background:transparent;padding:3px 2px;font-family:var(--mono);}
.finance-tbl td.fval .computed{font-family:var(--mono);font-weight:600;color:var(--ink);}
.finance-tbl tr.highlight td{background:var(--accent-soft);font-weight:700;}
.finance-tbl td.funit{width:36px;color:var(--ink-soft);font-family:var(--mono);font-size:11px;}

.rating-cat{margin-bottom:14px;}
.rating-cat-title{font-weight:600;font-size:12.5px;margin:14px 0 6px;color:var(--ink);}
table.rating-tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.rating-tbl th{background:var(--paper);border:1px solid var(--line);padding:5px 6px;font-size:10px;text-transform:uppercase;color:var(--ink-soft);}
table.rating-tbl td{border:1px solid var(--line);padding:4px 6px;}
.rating-btns{display:flex;gap:3px;}
.rating-btn{
  width:22px;height:22px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:11px;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
}
.rating-btn.active{background:var(--steel);color:#fff;border-color:var(--steel);}
.rating-score{font-family:var(--mono);text-align:center;}
.rating-total-row td{background:var(--ink);color:#fff;font-weight:700;}
.rating-grand{
  margin-top:16px;padding:12px 16px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;
}
.rating-grand .gscore{font-family:var(--mono);font-size:22px;color:var(--accent-soft);}

.sheet-footer{
  border-top:1px solid var(--line);padding:10px 30px;
  display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);font-family:var(--mono);
}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(16,30,43,.5);display:flex;align-items:center;justify-content:center;z-index:50;
}
.modal{
  background:#fff;width:440px;max-width:92vw;border-radius:2px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal h3{font-family:var(--serif);margin:0 0 14px;font-size:17px;}
.modal .field{margin-bottom:14px;}
.modal .field label{font-size:11px;color:var(--ink-soft);margin-bottom:4px;display:block;}
.modal .field input[type=text]{width:100%;border:1px solid var(--line);padding:8px 9px;border-radius:2px;}
.modal .logo-row{display:flex;align-items:center;gap:12px;}
.modal .logo-preview{
  height:56px;width:96px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:var(--paper);flex:0 0 auto;
}
.modal .logo-preview img{max-height:100%;max-width:100%;object-fit:contain;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:2px;font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.show{opacity:1;}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.sheet-actions,.workspace{all:unset;}
  body{background:#fff;}
  #app{display:block;}
  .workspace{display:block;padding:0;}
  .sheet{box-shadow:none;border:none;max-width:none;width:100%;}
  .add-row-btn,.rowdel{display:none !important;}
  table.tbl{page-break-inside:auto;}
  table.tbl tr{page-break-inside:avoid;}
  .block{page-break-inside:avoid;}
  @page{size:A4;margin:14mm;}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">ENGINEX</div>
      <div class="sub">Site Forms &amp; Document Control</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchBox" placeholder="Search forms…" oninput="renderNav()">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">24 standard site forms &middot; ENGINEX Engineering Suite</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="company-chip" id="companyChip"></div>
      <button class="btn" onclick="openSettings()">Company &amp; Logo</button>
      <button class="btn" onclick="exportAllJSON()">Export data</button>
      <label class="btn" style="margin:0;">
        Import data
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJSON(event)">
      </label>
    </div>
    <div class="workspace" id="workspace"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

const CATEGORY_ORDER = ["Site Establishment", "Submittals", "Inspections & QA/QC", "Site Reporting", "Safety", "Commercial & Change Management", "Handover & Closeout"];
const LS_PREFIX = "copperline_forms_v1_";
const LS_COMPANY = "copperline_forms_company_v1";
const LS_COUNTERS = "copperline_forms_counters_v1";

let currentCode = null;
let currentData = {};
let company = loadCompany();

function loadCompany(){
  try{
    const raw = localStorage.getItem(LS_COMPANY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { logo:"", name:"", address:"", projectName:"", projectNo:"" };
}
function saveCompany(){ localStorage.setItem(LS_COMPANY, JSON.stringify(company)); }

function loadCounters(){
  try{ const raw = localStorage.getItem(LS_COUNTERS); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveCounters(c){ localStorage.setItem(LS_COUNTERS, JSON.stringify(c)); }
function nextCounter(code){
  const c = loadCounters();
  c[code] = (c[code]||0) + 1;
  saveCounters(c);
  return c[code];
}

function findForm(code){ return FORMS.find(x=>x.code===code); }

function defaultDataForForm(form){
  const data = {};
  function walk(blocks){
    blocks.forEach(b=>{
      if(b.type==="grid"){ b.fields.forEach(fl=>{ data[fl.key] = ""; }); }
      else if(b.type==="row"){ walk(b.blocks); }
      else if(b.type==="check"){ data[b.key] = []; }
      else if(b.type==="table"){
        const rows=[]; for(let i=0;i<b.minRows;i++){ rows.push(emptyRow(b.columns)); }
        data[b.key]=rows;
      }
      else if(b.type==="fixedTable"){
        const rows={}; b.rows.forEach(r=>{ rows[r.key]={}; b.columns.forEach(c=>rows[r.key][c.key]=""); });
        data[b.key]=rows;
      }
      else if(b.type==="sign"){
        const sd={}; b.parties.forEach(p=>{ sd[p.key]={}; b.fields.forEach(fn=>sd[p.key][fn]=""); });
        data[b.key]=sd;
      }
      else if(b.type==="finance"){ data[b.key]={}; }
      else if(b.type==="rating"){
        const rd={ marks:{} }; data[b.key]=rd;
      }
    });
  }
  walk(form.fields);
  // prefill from company
  if("projectName" in data && !data.projectName) data.projectName = company.projectName||"";
  if("project" in data && !data.project) data.project = company.projectName||"";
  if("projectNo" in data && !data.projectNo) data.projectNo = company.projectNo||"";
  if("projectRef" in data && !data.projectRef) data.projectRef = company.projectNo||"";
  return data;
}
function emptyRow(columns){ const r={}; columns.forEach(c=>r[c.key]=""); return r; }

function loadFormData(code){
  const form = findForm(code);
  try{
    const raw = localStorage.getItem(LS_PREFIX+code);
    if(raw){ return Object.assign(defaultDataForForm(form), JSON.parse(raw)); }
  }catch(e){}
  return defaultDataForForm(form);
}
let saveTimer=null;
function saveCurrent(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    localStorage.setItem(LS_PREFIX+currentCode, JSON.stringify(currentData));
  }, 300);
}

/* ---------------- NAV ---------------- */
function renderNav(){
  const q = (document.getElementById("searchBox").value||"").toLowerCase();
  const nav = document.getElementById("nav");
  nav.innerHTML="";
  CATEGORY_ORDER.forEach(cat=>{
    const items = FORMS.filter(f=> f.category===cat && (
      f.name.toLowerCase().includes(q) || f.code.toLowerCase().includes(q) || f.short.toLowerCase().includes(q)
    ));
    if(items.length===0) return;
    const h = document.createElement("div");
    h.className="nav-cat"; h.textContent=cat;
    nav.appendChild(h);
    items.forEach(it=>{
      const d = document.createElement("div");
      d.className="nav-item"+(it.code===currentCode?" active":"");
      d.innerHTML = '<span class="code">'+it.code+'</span><span class="nm">'+it.short+'</span>';
      d.onclick=()=>selectForm(it.code);
      nav.appendChild(d);
    });
  });
}

function selectForm(code){
  currentCode = code;
  currentData = loadFormData(code);
  renderNav();
  renderWorkspace();
}

    <div class="modal">

function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function onLogoPick(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    company._tmpLogo = reader.result;
    document.getElementById("logoPrev").innerHTML = '<img src="'+reader.result+'">';
  };
  reader.readAsDataURL(file);
}
function saveSettings(){
  company.name = document.getElementById("stCompanyName").value;
  company.address = document.getElementById("stCompanyAddr").value;
  company.projectName = document.getElementById("stProjectName").value;
  company.projectNo = document.getElementById("stProjectNo").value;
  if(company._tmpLogo){ company.logo = company._tmpLogo; delete company._tmpLogo; }
  saveCompany();
  renderCompanyChip();
  if(currentCode) renderWorkspace();
  closeModal();
  showToast("Company details saved");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------------- helpers ---------------- */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escAttr(s){ return esc(s); }
function getPath(obj, key){ return obj[key]; }

/* ---------------- WORKSPACE / SHEET RENDER ---------------- */
function renderWorkspace(){
  const ws = document.getElementById("workspace");
  if(!currentCode){
    ws.innerHTML = '<div class="empty-state"><h2>Select a form to begin</h2><p>Choose any of the 24 standard site document-control forms from the left. Every field is editable, your entries are saved automatically in this browser, and each form can be printed or saved as PDF with your company logo on the letterhead.</p></div>';
    return;
  }
  const form = findForm(currentCode);
  let html = '<div style="width:100%;max-width:900px;">';
  html += '<div class="sheet-actions">';
  html += '<button class="btn small" onclick="newDraft()">+ New / Renumber</button>';
  html += '<button class="btn small danger" onclick="resetDraft()">Clear form</button>';
  html += '<div class="spacer"></div>';
  html += '<button class="btn small primary" onclick="window.print()">Print / Save PDF</button>';
  html += '</div>';
  html += '<div class="sheet" id="sheetEl">';
  html += renderLetterhead(form);
  html += '<div class="sheet-body">';
  form.fields.forEach((block,idx)=>{ html += renderBlock(block, idx); });
  html += '</div>';
  html += renderFooter(form);
  html += '</div></div>';
  ws.innerHTML = html;
  attachEvents();
  recalcAll();
}

function renderLetterhead(form){
  const logo = company.logo ? '<img src="'+company.logo+'">' : '';
  let h = '<div class="letterhead">';
  h += '<div class="lh-left">'+logo+'<div><div class="lh-co">'+esc(company.name||"Company Name")+'</div><div class="lh-co-addr">'+esc(company.address||"")+'</div></div></div>';
  h += '<div class="lh-right"><div class="lh-code">'+form.code+' &middot; '+form.rev+'</div><div>Printed '+ new Date().toLocaleDateString() +'</div></div>';
  h += '</div>';
  h += '<div class="form-title-bar"><h1>'+esc(form.name)+'</h1><div class="form-sub">'+esc(form.category)+'</div></div>';
  return h;
}
function renderFooter(form){
  return '<div class="sheet-footer"><span>'+form.code+' &nbsp;Rev.'+form.rev+'</span><span>Copperline Site Document Control</span></div>';
}

function renderBlock(block, idx){
  switch(block.type){
    case "grid": return renderGrid(block, idx);
    case "row": return '<div class="block row-flex">'+block.blocks.map(b=>'<div>'+renderBlock(b, idx)+'</div>').join('')+'</div>';
    case "check": return renderCheck(block, idx);
    case "table": return renderTableBlock(block, idx);
    case "fixedTable": return renderFixedTable(block, idx);
    case "sign": return renderSign(block, idx);
    case "note": return '<div class="block"><div class="note-block">'+esc(block.text)+'</div></div>';
    case "legend": return renderLegend(block, idx);
    case "finance": return renderFinance(block, idx);
    case "rating": return renderRating(block, idx);
    default: return "";
  }
}

function renderGrid(block, idx){
  let h = '<div class="block"><div class="fgrid c'+block.cols+'">';
  block.fields.forEach(fl=>{
    const val = currentData[fl.key]!=null?currentData[fl.key]:"";
    const wide = fl.kind==="textarea" ? ' span2' : '';
    h += '<div class="field'+wide+'"><label>'+esc(fl.label)+'</label>';
    if(fl.kind==="textarea"){
      h += '<textarea data-key="'+fl.key+'">'+esc(val)+'</textarea>';
    } else if(fl.kind==="select"){
      h += '<select data-key="'+fl.key+'">';
      (fl.options||[]).forEach(o=>{ h += '<option value="'+esc(o)+'" '+(val===o?'selected':'')+'>'+esc(o)+'</option>'; });
      h += '</select>';
    } else {
      const type = fl.kind==="date"?"date":(fl.kind==="number"?"number":"text");
      h += '<input type="'+type+'" data-key="'+fl.key+'" value="'+escAttr(val)+'">';
    }
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

function renderCheck(block, idx){
  const sel = currentData[block.key]||[];
  let h = '<div class="block"><div class="block-title">'+esc(block.label)+'</div><div class="check-group">';
  block.options.forEach(opt=>{
    const checked = sel.includes(opt) ? "checked" : "";
    h += '<label class="check-item"><input type="checkbox" data-checkkey="'+block.key+'" data-val="'+escAttr(opt)+'" '+checked+'> '+esc(opt)+'</label>';
  });
  h += '</div></div>';
  return h;
}

function renderLegend(block, idx){
  let h = '<div class="block legend-block"><div class="legend-title">'+esc(block.title)+'</div><div class="legend-list">';
  block.items.forEach(it=>{
    h += '<div class="legend-row"><span class="lc">'+esc(it.code)+'</span><span>'+esc(it.label)+'</span></div>';
  });
  h += '</div></div>';
  return h;
}

function renderTableBlock(block, idx){
  return '<div class="block" id="blockwrap-'+block.key+'">'+
    '<div class="block-title">'+esc(block.title)+'</div>'+
    renderTableInner(block)+
    '</div>';
}
function renderTableInner(block){
  const rows = currentData[block.key]||[];
  let h = '<div class="table-wrap"><table class="tbl"><thead><tr>';
  block.columns.forEach(c=>{ h += '<th>'+esc(c.label)+'</th>'; });
  if(block.addable) h += '<th style="width:26px;"></th>';
  h += '</tr></thead><tbody>';
  rows.forEach((r, ri)=>{
    h += '<tr>';
    block.columns.forEach(c=>{
      const v = r[c.key]||"";
      h += '<td><input type="text" data-table="'+block.key+'" data-row="'+ri+'" data-col="'+c.key+'" value="'+escAttr(v)+'"></td>';
    });
    if(block.addable) h += '<td><button class="rowdel" data-deltable="'+block.key+'" data-delrow="'+ri+'">\u2715</button></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if(block.addable) h += '<button class="add-row-btn" data-addtable="'+block.key+'">+ Add row</button>';
  return h;
}

function renderFixedTable(block, idx){
  const data = currentData[block.key]||{};
  let h = '<div class="block"><div class="block-title">'+esc(block.title)+'</div><div class="table-wrap"><table class="tbl"><thead><tr>';
  h += '<th>'+esc(block.rowLabelHeader)+'</th>';
  block.columns.forEach(c=>{ h += '<th>'+esc(c.label)+'</th>'; });
  h += '</tr></thead><tbody>';
  block.rows.forEach(r=>{
    h += '<tr><td style="padding:5px 8px;">'+esc(r.label)+'</td>';
    block.columns.forEach(c=>{
      const v = (data[r.key]&&data[r.key][c.key])||"";
      h += '<td><input type="text" data-fixed="'+block.key+'" data-frow="'+r.key+'" data-fcol="'+c.key+'" value="'+escAttr(v)+'"></td>';
    });
    h += '</tr>';
  });
  if(block.totals){
    h += '<tr class="total-row"><td>Total</td>';
    block.columns.forEach(c=>{ h += '<td id="fixedtotal-'+block.key+'-'+c.key+'"></td>'; });
    h += '</tr>';
  }
  h += '</tbody></table></div></div>';
  return h;
}

function renderSign(block, idx){
  const data = currentData[block.key]||{};
  let h = '<div class="block"><div class="sign-grid">';
  block.parties.forEach(p=>{
    h += '<div class="sign-party"><div class="party-label">'+esc(p.label)+'</div>';
    block.fields.forEach(fn=>{
      const v = (data[p.key]&&data[p.key][fn])||"";
      h += '<div class="sfield"><label>'+esc(fn)+'</label><input type="text" data-sign="'+block.key+'" data-party="'+p.key+'" data-field="'+esc(fn)+'" value="'+escAttr(v)+'"></div>';
    });
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

/* ---------- Finance block (Payment Certificate) ---------- */
const FINANCE_ROWS = [
  {key:"originalContractValue", label:"Original Contract Value", kind:"input"},
  {key:"approvedVariations", label:"Approved Variations", kind:"input"},
  {key:"revisedContractValue", label:"Revised Contract Value", kind:"computed", fn:d=>num(d.originalContractValue)+num(d.approvedVariations)},
  {key:"sep1", label:"", kind:"sep"},
  {key:"valueOriginal", label:"A) Value of Work Done \u2014 as per Original Contract", kind:"input"},
  {key:"valueVariations", label:"B) Value of Work Done \u2014 as per Approved Variations", kind:"input"},
  {key:"materialOnSite", label:"C) Material on Site (if applicable)", kind:"input"},
  {key:"totalValueOfWorks", label:"D) Total Value of Works", kind:"computed", highlight:true, fn:d=>num(d.valueOriginal)+num(d.valueVariations)+num(d.materialOnSite)},
  {key:"advancePct", label:"Less: Recovery of Advance Payment (%)", kind:"pct"},
  {key:"advanceAmount", label:"E) Advance Payment Recovery", kind:"computed", fn:d=>num(d.advancePct)/100*(num(d.valueOriginal)+num(d.materialOnSite))},
  {key:"retentionPct", label:"Retention (%)", kind:"pct"},
  {key:"retentionAmount", label:"F) Retention Amount", kind:"computed", fn:d=>num(d.retentionPct)/100*(num(d.valueOriginal)+num(d.valueVariations)+num(d.materialOnSite))},
  {key:"otherDeductions", label:"G) Other Deductions", kind:"input"},
  {key:"totalDeductions", label:"H) Total Deductions", kind:"computed", fn:d=>num(d.advanceAmount)+num(d.retentionAmount)+num(d.otherDeductions)},
  {key:"totalCertified", label:"I) Total Amount Certified (D \u2212 H)", kind:"computed", highlight:true, fn:d=>(num(d.valueOriginal)+num(d.valueVariations)+num(d.materialOnSite))-(num(d.advanceAmount)+num(d.retentionAmount)+num(d.otherDeductions))},
  {key:"previouslyCertified", label:"J) Less Amount Previously Certified", kind:"input"},
  {key:"netAmountDue", label:"Net Amount Due", kind:"computed", highlight:true, fn:d=>{
      const D = num(d.valueOriginal)+num(d.valueVariations)+num(d.materialOnSite);
      const H = num(d.advanceAmount)+num(d.retentionAmount)+num(d.otherDeductions);
      return (D-H)-num(d.previouslyCertified);
    }},
];
function num(v){ const n = parseFloat(v); return isNaN(n)?0:n; }
function renderFinance(block, idx){
  const data = currentData[block.key]||{};
  let h = '<div class="block"><div class="block-title">Payment Details (SAR)</div><table class="finance-tbl" id="financetbl-'+block.key+'"><tbody>';
  FINANCE_ROWS.forEach(r=>{
    if(r.kind==="sep"){ h+='<tr><td colspan="3" style="border:none;height:6px;"></td></tr>'; return; }
    h += '<tr'+(r.highlight?' class="highlight"':'')+'><td class="flabel">'+esc(r.label)+'</td><td class="fval">';
    if(r.kind==="input" || r.kind==="pct"){
      const v = data[r.key]||"";
      h += '<input type="number" step="0.01" data-fin="'+block.key+'" data-fkey="'+r.key+'" value="'+escAttr(v)+'">';
    } else {
      h += '<span class="computed" id="fin-'+block.key+'-'+r.key+'">0.00</span>';
    }
    h += '</td><td class="funit">'+(r.kind==="pct"?"%":(r.kind==="sep"?"":"SAR"))+'</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}
function recalcFinance(){
  document.querySelectorAll('[data-fin]').forEach(()=>{});
  const financeBlocks = collectBlocksOfType("finance");
  financeBlocks.forEach(block=>{
    const data = currentData[block.key]||{};
    FINANCE_ROWS.forEach(r=>{
      if(r.kind==="computed"){
        const v = r.fn(data);
        data[r.key]=v;
        const el = document.getElementById('fin-'+block.key+'-'+r.key);
        if(el) el.textContent = v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
      }
    });
    currentData[block.key]=data;
  });
}

/* ---------- Rating block (Safety Inspection) ---------- */
function renderRating(block, idx){
  const marks = (currentData[block.key]&&currentData[block.key].marks)||{};
  let h = '<div class="block" id="ratingblock-'+block.key+'">';
  block.categories.forEach(cat=>{
    h += '<div class="rating-cat"><div class="rating-cat-title">'+esc(cat.title)+'</div>';
    h += '<table class="rating-tbl"><thead><tr><th style="width:46%;">Item</th><th>Score (1\u20135)</th><th style="width:80px;">Possible</th><th style="width:80px;">Actual</th></tr></thead><tbody>';
    cat.items.forEach(it=>{
      const m = marks[it.key]||0;
      h += '<tr><td>'+esc(it.label)+'</td><td><div class="rating-btns">';
      for(let s=1;s<=5;s++){
        h += '<button type="button" class="rating-btn'+(m===s?' active':'')+'" data-ratekey="'+block.key+'" data-rateitem="'+it.key+'" data-ratescore="'+s+'">'+s+'</button>';
      }
      h += '</div></td><td class="rating-score">'+it.possible+'</td><td class="rating-score" id="ractual-'+block.key+'-'+it.key+'">0</td></tr>';
    });
    h += '</tbody><tfoot><tr class="rating-total-row"><td colspan="2">'+esc(cat.title)+' \u2014 Assessment</td><td id="rposs-'+block.key+'-'+cat.title.replace(/[^a-zA-Z0-9]/g,"_")+'"></td><td id="rcattotal-'+block.key+'-'+cat.title.replace(/[^a-zA-Z0-9]/g,"_")+'"></td></tr></tfoot></table></div>';
  });
  h += '<div class="rating-grand"><div>Overall Site Safety Score</div><div class="gscore" id="rgrand-'+block.key+'">0 / 0 (0%)</div></div>';
  h += '</div>';
  return h;
}
function recalcRating(){
  const ratingBlocks = collectBlocksOfType("rating");
  ratingBlocks.forEach(block=>{
    if(!currentData[block.key]) currentData[block.key]={marks:{}};
    const marks = currentData[block.key].marks||{};
    let grandActual=0, grandPossible=0;
    block.categories.forEach(cat=>{
      let catActual=0, catPossible=0;
      cat.items.forEach(it=>{
        const m = marks[it.key]||0;
        const actual = Math.round(it.possible*(m/5));
        catActual+=actual; catPossible+=it.possible;
        const elA = document.getElementById('ractual-'+block.key+'-'+it.key);
        if(elA) elA.textContent = m>0?actual:"\u2014";
      });
      const safeTitle = cat.title.replace(/[^a-zA-Z0-9]/g,"_");
      const elP = document.getElementById('rposs-'+block.key+'-'+safeTitle);
      const elC = document.getElementById('rcattotal-'+block.key+'-'+safeTitle);
      if(elP) elP.textContent = catPossible;
      if(elC) elC.textContent = catActual;
      grandActual+=catActual; grandPossible+=catPossible;
    });
    const pct = grandPossible? Math.round(grandActual/grandPossible*100):0;
    const elG = document.getElementById('rgrand-'+block.key);
    if(elG) elG.textContent = grandActual+' / '+grandPossible+' ('+pct+'%)';
  });
}

function collectBlocksOfType(type){
  const form = findForm(currentCode);
  const out=[];
  function walk(blocks){ blocks.forEach(b=>{ if(b.type===type) out.push(b); if(b.type==="row") walk(b.blocks); }); }
  walk(form.fields);
  return out;
}

function recalcFixedTotals(){
  const fts = collectBlocksOfType("fixedTable");
  fts.forEach(block=>{
    const data = currentData[block.key]||{};
    block.columns.forEach(c=>{
      let sum=0;
      block.rows.forEach(r=>{ sum += num(data[r.key] && data[r.key][c.key]); });
      const el = document.getElementById('fixedtotal-'+block.key+'-'+c.key);
      if(el) el.textContent = sum || "";
    });
  });
}

function recalcAll(){
  recalcFinance();
  recalcRating();
  recalcFixedTotals();
}

/* ---------------- EVENTS ---------------- */
function attachEvents(){
  const sheet = document.getElementById("sheetEl");
  if(!sheet) return;

  sheet.addEventListener("input", (e)=>{
    const t = e.target;
    if(t.dataset.key){
      currentData[t.dataset.key] = t.value;
    } else if(t.dataset.table!=null){
      const k=t.dataset.table, ri=t.dataset.row, col=t.dataset.col;
      if(!currentData[k]) currentData[k]=[];
      if(!currentData[k][ri]) currentData[k][ri]={};
      currentData[k][ri][col]=t.value;
    } else if(t.dataset.fixed!=null){
      const k=t.dataset.fixed, rk=t.dataset.frow, ck=t.dataset.fcol;
      if(!currentData[k]) currentData[k]={};
      if(!currentData[k][rk]) currentData[k][rk]={};
      currentData[k][rk][ck]=t.value;
      recalcFixedTotals();
    } else if(t.dataset.sign!=null){
      const k=t.dataset.sign, pk=t.dataset.party, fn=t.dataset.field;
      if(!currentData[k]) currentData[k]={};
      if(!currentData[k][pk]) currentData[k][pk]={};
      currentData[k][pk][fn]=t.value;
    } else if(t.dataset.fin!=null){
      const k=t.dataset.fin, fk=t.dataset.fkey;
      if(!currentData[k]) currentData[k]={};
      currentData[k][fk]=t.value;
      recalcFinance();
    }
    saveCurrent();
  });

  sheet.addEventListener("change", (e)=>{
    const t = e.target;
    if(t.dataset.checkkey){
      const k=t.dataset.checkkey, v=t.dataset.val;
      if(!currentData[k]) currentData[k]=[];
      const arr = currentData[k];
      const i = arr.indexOf(v);
      if(t.checked && i===-1) arr.push(v);
      if(!t.checked && i!==-1) arr.splice(i,1);
      saveCurrent();
    }
  });

  sheet.addEventListener("click", (e)=>{
    const add = e.target.closest("[data-addtable]");
    if(add){
      const k = add.dataset.addtable;
      const block = findTableBlock(k);
      if(!currentData[k]) currentData[k]=[];
      currentData[k].push(emptyRow(block.columns));
      document.getElementById("blockwrap-"+k).querySelector(".table-wrap, .add-row-btn");
      rerenderTable(k, block);
      saveCurrent();
      return;
    }
    const del = e.target.closest("[data-deltable]");
    if(del){
      const k = del.dataset.deltable, ri = parseInt(del.dataset.delrow,10);
      const block = findTableBlock(k);
      currentData[k].splice(ri,1);
      rerenderTable(k, block);
      saveCurrent();
      return;
    }
    const rateBtn = e.target.closest("[data-ratekey]");
    if(rateBtn){
      const k=rateBtn.dataset.ratekey, itemKey=rateBtn.dataset.rateitem, score=parseInt(rateBtn.dataset.ratescore,10);
      if(!currentData[k]) currentData[k]={marks:{}};
      if(!currentData[k].marks) currentData[k].marks={};
      currentData[k].marks[itemKey] = currentData[k].marks[itemKey]===score ? 0 : score;
      renderRatingBlockInPlace(k);
      saveCurrent();
      return;
    }
  });
}

function findTableBlock(key){
  const form = findForm(currentCode);
  let found=null;
  function walk(blocks){ blocks.forEach(b=>{ if(b.type==="table" && b.key===key) found=b; if(b.type==="row") walk(b.blocks); }); }
  walk(form.fields);
  return found;
}
function rerenderTable(key, block){
  const wrap = document.getElementById("blockwrap-"+key);
  if(!wrap) return;
  wrap.innerHTML = '<div class="block-title">'+esc(block.title)+'</div>'+renderTableInner(block);
}
function renderRatingBlockInPlace(key){
  const block = collectBlocksOfType("rating").find(b=>b.key===key);
  const el = document.getElementById("ratingblock-"+key);
  if(!el || !block) return;
  el.outerHTML = renderRating(block);
  recalcRating();
}

/* ---------------- ACTIONS ---------------- */
function newDraft(){
  const form = findForm(currentCode);
  const n = nextCounter(form.code);
  currentData = defaultDataForForm(form);
  if(form.numberField){
    currentData[form.numberField] = String(n).padStart(3,"0");
  }
  const todayKey = Object.keys(currentData).find(k=>k==="date");
  if(todayKey) currentData.date = new Date().toISOString().slice(0,10);
  saveCurrent();
  renderWorkspace();
  showToast("New "+form.short+" started"+(form.numberField?" (No. "+String(n).padStart(3,"0")+")":""));
}
function resetDraft(){
  if(!confirm("Clear all entries on this form? This cannot be undone.")) return;
  const form = findForm(currentCode);
  currentData = defaultDataForForm(form);
  saveCurrent();
  renderWorkspace();
}

function exportAllJSON(){
  const out = { company, forms:{} };
  FORMS.forEach(f=>{
    const raw = localStorage.getItem(LS_PREFIX+f.code);
    if(raw) out.forms[f.code]=JSON.parse(raw);
  });
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="copperline-site-forms-data.json"; a.click();
  URL.revokeObjectURL(url);
}
function importJSON(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const obj = JSON.parse(reader.result);
      if(obj.company){ company = obj.company; saveCompany(); renderCompanyChip(); }
      if(obj.forms){
        Object.keys(obj.forms).forEach(code=>{
          localStorage.setItem(LS_PREFIX+code, JSON.stringify(obj.forms[code]));
        });
      }
      if(currentCode) selectForm(currentCode);
      showToast("Data imported");
    }catch(e){ alert("Could not read that file."); }
  };
  reader.readAsText(file);
  ev.target.value="";
}

/* ---------------- INIT ---------------- */
renderCompanyChip();
renderNav();
renderWorkspace();
